name: MicroTech Medical
description: >-
  MicroTech Medical (Hangzhou) develops user-friendly diabetes glucose
  monitoring devices — blood glucose monitoring systems (BGMS), the AiDEX
  continuous glucose monitoring (CGM) system, the Equil patch insulin pump, a
  closed-loop artificial pancreas, point-of-care testing (POCT), and LinX. Its
  AiDEX API Platform (aidexapi.microtechmd.com) is a self-service developer
  portal that registers developers and issues API credentials for accessing
  blood glucose data resources from AiDEX CGM devices, with separate global and
  China regional endpoints. The company was surfaced as a portfolio company of
  Qiming Venture Partners.
